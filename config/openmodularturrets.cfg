general {
    # Version of this file's format and defaults; the mod updates it when it migrates the file. Do not change it.
    # Min: 1
    # Max: 2147483647
    I:configVersion=4

    # Which recipes to use. Valid values: auto, enderio, mekanism, vanilla
    S:recipes=auto

    # If enabled: Which items (modid:item[:meta], or ore:oreDictName for every item of an ore dictionary entry, e.g. ore:plankWood) can be used as disposable ammo. Value behind ',' is damage bonus.
    S:stringAmmoAllowList <
        minecraft:cobblestone,2
        ore:plankWood,1
     >

    # Which entities should not be targeted by turrets?
    S:stringMobBlackList <
        minecraft:armor_stand
     >

    # Which entities should always be seen as hostile by turrets?
    S:stringMobForceList <
        minecraft:creeper
     >

    # Which entities should always be seen as neutral by turrets? An entity on both force lists is ignored on both.
    S:stringNeutralForceList <
        minecraft:cow
     >

    # Use a whitelist for ammo (which items fit into ammo slots of base)?
    B:useWhitelistForAmmo=true
}


miscellaneous {
    # Generator: energy buffer. It pauses burning while the buffer is full.
    # Min: 1
    # Max: 2000000000
    I:generatorCapacity=1000000

    # Generator: energy generated per tick while burning fuel, before energy multiplier upgrades.
    # Min: 1
    # Max: 1000000
    I:generatorEnergyPerTick=40

    # Generator: energy per tick pushed into all neighbours together.
    # Min: 1
    # Max: 2000000000
    I:generatorMaxOutput=65536

    # Min: 0
    # Max: 2147483647
    I:redstoneReactorAddonGen=1600

    # Min: 0
    # Max: 2147483647
    I:solarPanelAddonGen=10
}


