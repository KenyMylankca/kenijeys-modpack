# Configuration file

general {
    # Can OPs access all owned blocks?
    B:canOPAccessOwnedBlocks=false

    # Claiming a block without an owner also claims the unowned turret bases, camouflage traps and passive defense blocks connected to it (turrets connect too). At most this many blocks are walked per claim, the Ownership Wand uses the same limit.
    # Min: 1
    # Max: 65536
    I:claimSpreadLimit=1024

    # Should OpenModular Mods print out debug messages in log? (Warning, spammy)
    B:debugLogging=false

    # Should some blocks write debug messages on interaction?
    B:doDebugChat=false

    # Fake players of machines may claim blocks without an owner by right-clicking them.
    B:fakePlayersCanClaim=false

    # Enable compat for offline mode servers?
    B:offlineModeSupport=true

    # Which recipes to use. Valid values: auto, enderio, mekanism, vanilla
    S:recipes=auto
}


