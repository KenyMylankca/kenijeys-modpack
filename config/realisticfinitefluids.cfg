# Configuration file

general {

    tickrates {
        # Lava tick rate. 24 = Original, 30 = Default.
        # Min: 0
        # Max: 2147483647
        I:lavaTickRate=30

        # Water tick rate. 4 = Original, 8 = Default.
        # Min: 0
        # Max: 2147483647
        I:waterTickRate=8
    }

    fluidlogic {
        # The amount of Ocean blocks that will turn into Still/Flowing blocks when you interact with them.
        # 2048 = Original. 512 = Default.
        # Min: 1
        # Max: 2147483647
        I:lakeLimit=512

        # Whether fluids should have random ticks.
        B:shouldTickRandomly=true
    }

    rain {
        # Enable finite water rain.
        B:enableRain=true

        # A proportional modifier to the probability of a water drop to fall per tick when raining.
        # Values bigger than 24 won't increase the rain amount. It can't be zero, but 0.1 is valid.
        D:rainAmount=1.0
    }

    pressure {
        # Whether to activate the pressure system.
        B:doPressure=true

        # The maximum tries we will check for blocks to apply pressure.
        # Min: 0
        # Max: 2147483647
        I:pressureLimit=256
    }

    evaporation {
        # If water should evaporate. Only applies to water with the minimum level of fluid.
        B:enableEvaporation=true

        # Probability of water evaporation per tick. 1 = 100%, 2 = 50%, 100 = 1%. 100 = Default.
        # Min: 1
        # Max: 2147483647
        I:evaporationChance=10
    }

    misclogic {
        # Create finite fluid Blocks for Fluids that have no default Block assigned.
        B:createBlocksForBlocklessFluids=true

        # Whether flowing liquids should move players on creative mode.
        B:flowingWaterShouldMoveCreativePlayer=true

        # If Fluids should break fragile blocks or not.
        B:fluidsBreakFragileBlocks=false

        # List of fragile blocks.
        S:fragileBlocks <
            minecraft:glass
            minecraft:glass_pane
            minecraft:stained_glass_pane
         >

        # List of modded fluids' names that should spawn as infinite fluids.
        # You can find the list of fluids inside your world inside: /.minecraft/saves/YOUR_WORLD_NAME/data.
        S:infiniteModdedFluids <
         >

        # Maximum distance between a flowing liquid and a player to decide whether postpone or update now the block at the current tick when currentCalc is starting to get closer to maxCalc.
        # Min: 1
        # Max: 2147483647
        I:playerMaxDistanceToCalc=1024

        # Whether big fluid masses (lakes, oceans) should act as infinite fluid sources.
        # It also works as a security switch to deactivate Ocean Blocks (if you find a finite fluid mass eating your world you better use /rffkillswitch).
        B:shouldFluidsBeInfinite=true

        # Whether fluids could go down in the 4 cardinal positions in 1 movement or not (it makes them appear to leak below cardinal edges).
        B:shouldFluidsMoveSidewayDownwards=false

        # Whether water can become ice.
        B:waterCanFreeze=true
    }

    farmland {
        # Whether to let Farmland blocks consume water or not.
        B:farmlandConsumesWater=false

        # The chance a Farmland block has to absorb water when hydrating itself.
        D:farmlandDrinkChance=0.33000001311302185

        # The amount of LEVELs a Farmland block will consume when hydrating itself.
        # 1 for default, not recommended to be above 8.
        # Min: 1
        # Max: 2147483647
        I:farmlandLevelsPerHydration=1
    }

    sponge {
        # The method the Sponge will use to absorb water.
        # AREA = Absorbs all water within the spongeAbsorbRange value.
        # CONNECTED = Only absorbs adjacent and connected water within the spongeAbsorbRange value.
        S:spongeAbsorbMethod=CONNECTED

        # The maximum range the sponge will try to absorb water based on the spongeAbsorbMethod.
        # Min: 0
        # Max: 2147483647
        I:spongeAbsorbRange=5

        # The maximum quantity of Water LEVELs a Sponge should carry.
        # 8 = 1 block, 16 = 2 blocks, 32 = 4 blocks.
        # Min: 0
        # Max: 2147483647
        I:spongeCapacityConceptualLevels=32

        # Whether to use custom finite logic for Sponge or the vanilla one.
        B:spongeUseFiniteLogic=true
    }

    bubblecolumns {
        # Whether to enable Bubble Columns or not.
        # (These that appear in water when you place Soul Sand or Magma Blocks on the ocean floor).
        B:enableBubbleColumns=true

        # The maximum height a Bubble Column can have.
        # (the maximum distance between the top water block with a Bubble Column and the Soul Sand/Magma Block).
        # This is the maximum distance the scan for the block will be done.
        # Min: 0
        # Max: 2147483647
        I:maxBubbleColumnSize=62
    }

    performance {
        # Max number of finite fluid calculations every tick.
        # Increase it in case you are seeing freezed fluid blocks on the air.
        # Min: 1
        # Max: 2147483647
        I:maxCalc=4096

        # The minimum number of fluid calculations allowed per tick.
        # The dynamic limit never goes below this, so fluids never freeze completely, even if the server is lagging.
        # Min: 1
        # Max: 2147483647
        I:minCalc=2048

        # Average milliseconds per tick the dynamic limit tries to stay under (50 = 20 TPS).
        # Above it the limit goes down; with room to spare it goes back up to maxCalc.
        D:targetMspt=45.0
    }

    rendering {
        # If fluids should use both dynamic and static fluid texture or just static one. Only has aesthetic effect.
        B:dynamicOrStaticTexture=true

        # If fluids should have the full block height or not. Only has aesthetic effect.
        B:maxOrNormalFluidHeight=true

        # The amount of light the water will remove when it passes through it. 3 = Vanilla, 1 = Default.
        # Min: 0
        # Max: 2147483647
        I:waterLightOpacity=1
    }

    debug {
        # Allow logDebug prints for special info about registerings.
        B:logDebug=false

        # Allow visualDebug content. Only for testing purposes.
        B:visualDebug=false
    }

    barrier {
        # Ocean barrier method (to avoid leaving openings between underwater mines and the ocean).
        # FULL = Best method to patch terrain.
        # PARTIAL = If you find chunks taking too much to generate choose this one.
        # Options: NONE, PARTIAL, FULL.
        S:oceanBarrierMode=FULL
    }

    simulation {
        # Required Tick Calls made by fluid blocks per cluster to trigger the simulation.
        # Low values trigger simulations more often, bigger values do the opossite.
        # The point is to get a balance between making many Regions of simulations vs not making them when they would do charms.
        # 150 is a good value, tho anything between 100-150 would be good.
        D:clusterTriggerDemand=150.0

        # Enables the Simulation Performance Optimizations for the fluid blocks.
        B:enableSimulation=true

        # Half the size of a Region (the areas of simulated fluid).
        # It is not recommended to increase this too much.
        # Base value = 24. But i use 32 since i increased performance.
        I:maximumHalfSize=32
    }

}


