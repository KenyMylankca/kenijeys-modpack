# Configuration file

general {

    ##########################################################################################################
    # generation
    #--------------------------------------------------------------------------------------------------------#
    # Village generation chances. Each village rolls once; 100 is always, 0 is never.
    ##########################################################################################################

    generation {
        # Chance for a village to generate a town keep.
        # Min: 0
        # Max: 100
        I:keepSpawnChance=50

        # Chance for a village to generate town walls.
        # Min: 0
        # Max: 100
        I:wallSpawnChance=50

        # Chance for a village to generate watch towers.
        # Min: 0
        # Max: 100
        I:watchTowerSpawnChance=50
    }

    ##########################################################################################################
    # guards
    #--------------------------------------------------------------------------------------------------------#
    # Witchery village guards.
    ##########################################################################################################

    guards {
        # Spawn 6 village guards along village streets. Requires Spawn Village Guards.
        B:spawnStreetGuards=true

        # Spawn Witchery village guards on keeps, towers, walls, and streets.
        # Also controls the spawn egg and /summon witcherywalls:village_guard.
        B:spawnVillageGuards=true
    }

}


